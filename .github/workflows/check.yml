name: Python checks
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q bot.py core modules
      - run: pip install -r requirements.txt
      - run: python -c "import bot; print('Imports OK')"
      - run: python -m unittest discover -s tests -v
